# Release gate: the checks a change must pass before merge. Runs on push
# and pull requests. `make check` is the project's authoritative gate
# (go vet, staticcheck, go test, frontend build + tests, and the binary
# 30 MB / bundle 100 KB size gates); the race suite runs separately.
#
# The heavier suites are deliberately NOT here: `make integration` needs
# a built Ergo, and `make irctest` a python3-venv checkout — both are run
# locally before releases (and can move to a nightly/release workflow if
# that cost is ever wanted). This keeps per-push CI fast while still
# enforcing the size budgets and race safety that only ran locally.
name: ci

# push only on main; branch pushes are covered by their pull_request run,
# so PRs (including Dependabot's) don't run this twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the repo (no releases, no PR writes).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (a retagged action can't change
      # under us); the trailing comment records the tag. Bumped via Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # go vet, staticcheck, go test, frontend build + tests, and the
      # binary (30 MB) and bundle (100 KB gzipped) size gates.
      - name: make check
        run: make check

      - name: Race tests
        run: go test -race ./internal/...

  # Layout regressions for the virtualized message list, in a real Chromium
  # against the real stylesheet (web/browser-test/). Its own job because it
  # needs a ~260 MB browser: keeping it out of `make check` means a fresh
  # clone still runs the full gate offline, and a browser download can never
  # make the authoritative gate flaky.
  #
  # This exists because three layout bugs shipped to a phone that neither the
  # DOM-less unit suite nor review could see. All three fail this job.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # --ignore-scripts: dependency lifecycle scripts are arbitrary code run
      # at install time. Nothing here needs them — esbuild ships its platform
      # binary as an optionalDependency, and Playwright's browsers come from
      # the explicit `playwright install` below, not a postinstall hook.
      - name: Install frontend deps
        run: cd web && npm ci --no-fund --no-audit --ignore-scripts

      # Cache the browser by the resolved Playwright version: a mismatched
      # cache is worse than none (Playwright refuses a browser build it did
      # not pin), so the version goes in the key.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(cd web && node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # Chromium only — the suite asserts layout geometry, not cross-browser
      # rendering. --with-deps installs the system libraries it needs.
      #
      # The local binary, NOT `npx`: npx will fetch and execute a package from
      # the registry when the name doesn't resolve locally, so a typo or a
      # dropped devDependency turns into running unpinned code. This path can
      # only ever run the version in package-lock.json.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd web && ./node_modules/.bin/playwright install --with-deps chromium

      - name: make browser-test
        run: make browser-test
